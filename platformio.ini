[env:bluepill_f103c8]
platform  = ststm32
board     = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

build_flags =
    -Iinclude
    -I.pio/libdeps/bluepill_f103c8/FreeRTOS-Kernel/include
    -I.pio/libdeps/bluepill_f103c8/FreeRTOS-Kernel/portable/GCC/ARM_CM3
    -DSTM32F103xB
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    ; Uncomment for real hardware: starts the 4 s hardware IWDG in main.cpp.
    ; Keep OFF for Wokwi — the simulator does not emulate the IWDG reset.
    ; -DENABLE_IWDG
    -O2

lib_deps =
    https://github.com/FreeRTOS/FreeRTOS-Kernel.git#V11.3.1

lib_ldf_mode = chain

build_src_filter =
    +<*>

lib_compat_mode = off

extra_scripts = pre:scripts/prune_freertos.py
